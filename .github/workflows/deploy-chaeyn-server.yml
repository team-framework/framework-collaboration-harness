name: Deploy Discord Bot

on:
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - CLAUDE.md
      - alerts/**
      - sync/**
      - .codex/**
      - .claude/**
      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md
      - .github/workflows/assign-issue-author.yml
      - deploy/**
      - package.json
      - .github/workflows/deploy-chaeyn-server.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, chaeyn-server, framework-harness]
    steps:
      - uses: actions/checkout@v4
      - name: 서버 서비스 갱신
        shell: bash
        run: |
          set -euo pipefail
          app_dir=/home/chaeyn/apps/framework-collaboration-harness
          install -d -m 700 "$app_dir" "$app_dir/runtime"
          install -m 600 package.json "$app_dir/package.json"
          install -m 600 AGENTS.md "$app_dir/AGENTS.md"
          install -m 600 CLAUDE.md "$app_dir/CLAUDE.md"
          rsync -a --delete alerts/ "$app_dir/alerts/"
          rsync -a --delete sync/ "$app_dir/sync/"
          rsync -a --delete .codex/ "$app_dir/.codex/"
          rsync -a --delete .claude/ "$app_dir/.claude/"
          rsync -a --delete .github/ "$app_dir/.github/"
          install -m 600 deploy/Dockerfile "$app_dir/Dockerfile"
          install -m 600 deploy/compose.yaml "$app_dir/compose.yaml"
          cd "$app_dir"
          docker compose up -d --build
          docker compose ps
